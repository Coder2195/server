services:
  cloudflare-ddns:
    restart: always
    container_name: cloudflare-ddns
    image: timothyjmiller/cloudflare-ddns:latest
    security_opt:
      - no-new-privileges:true
    network_mode: 'host'
    environment:
      CLOUDFLARE_API_TOKEN_FILE: /run/secrets/cloudflare_api_token
      DOMAINS: server.coder2195.dev
    secrets:
      - cloudflare_api_token

  postgres-db:
    restart: always
    container_name: postgres-db
    image: postgres:latest
    environment:
      POSTGRES_USER: coder2195
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/
      - ./postgresql:/etc/postgresql_config/
    command: postgres -c config_file=/etc/postgresql_config/postgresql.conf
    secrets:
      - postgres_password

  caddy:
    restart: always
    container_name: caddy
    image: caddy:latest
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - $PWD/caddy/:/etc/caddy/
      - $PWD/site:/var/www/html
      - caddy_data:/data
      - caddy_config:/config


  minecraft-proxy:
    restart: always
    container_name: minecraft-proxy 
    image: itzg/mc-proxy
    environment:
      TYPE: VELOCITY
      REPLACE_ENV_VARIABLES: "true"
      CFG_MOTD: "Server hosted by &4&kaaa&k &4&lAmber &kaaa&k&r\nLike the server? support at &b&nko-fi.com/coder2195"
    ports:
      - "25565:25565"
    volumes:
      - ./minecraft/velocity.toml:/config/velocity.toml
      - ./secrets/velocity_secret.txt:/config/forwarding.secret
      - minecraft_proxy:/server

  amber-smp:
    restart: always
    container_name: amber-smp
    image: itzg/minecraft-server:latest
    volumes:
      - amber_smp:/data
    environment:
      TYPE: LEAF
      VERSION: 26.2
      ONLINE_MODE: FALSE
      EULA: TRUE
      DEBUG: TRUE
      SYNC_SKIP_NEWER_IN_DESTINATION: false

  pumpkin-anarchy:
    restart: always
    # Make sure to change the tag to the pumpkin version you want to use.
    # https://github.com/Pumpkin-MC/Pumpkin/pkgs/container/pumpkin/versions?filters%5Bversion_type%5D=tagged
    image: "ghcr.io/pumpkin-mc/pumpkin:master"
    container_name: pumpkin-anarchy
    volumes:
      - pumpkin_anarchy:/pumpkin
    security_opt:
      - no-new-privileges:true
    stdin_open: true
    tty: true
    cap_drop:
      - ALL
    read_only: true
      
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  amber_smp:
  pumpkin_anarchy:
  minecraft_proxy:

secrets:
  cloudflare_api_token:
    file: secrets/cloudflare_api_token.txt
  postgres_password:
    file: secrets/postgres_password.txt
  velocity_secret:
    file: secrets/velocity_secret.txt

