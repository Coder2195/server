services:
  cloudflare-ddns:
    restart: always
    container_name: cloudflare-ddns
    image: timothyjmiller/cloudflare-ddns:latest
    security_opt:
      - no-new-privileges:true
    network_mode: 'host'
    environment:
      CLOUDFLARE_API_TOKEN_FILE: /run/secrets/cloudflare_api_token
      DOMAINS: server.coder2195.dev
    secrets:
      - cloudflare_api_token

  postgres-db:
    restart: always
    container_name: postgres-db
    image: postgres:latest
    environment:
      POSTGRES_USER: coder2195
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/
    secrets:
      - postgres_password

  caddy:
    restart: always
    container_name: caddy
    image: caddy:latest
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - $PWD/caddy_config/:/etc/caddy/
      - $PWD/site:/var/www/html
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

secrets:
  cloudflare_api_token:
    file: secrets/cloudflare_api_token.txt
  postgres_password:
    file: secrets/postgres_password.txt

